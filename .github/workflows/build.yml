name: Build OTC AI Android APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tapılmadı!"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check ZIP file
        run: |
          if [ ! -f "POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip" ]; then
            echo "ZIP faylı tapılmadı!"
            exit 1
          fi
          unzip -t POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-OPTION-OTC-AI-V2-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error