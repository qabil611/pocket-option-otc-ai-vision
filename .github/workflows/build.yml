name: Build OTC AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Source ZIP
        run: |
          ls -lah
          test -f POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip
          unzip -t POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip

      - name: Extract Android Project
        run: |
          mkdir -p android-project
          unzip -q POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip -d android-project
          find android-project -name gradlew -type f

      - name: Locate Gradle Project
        run: |
          FILE=$(find android-project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Check Gradle Wrapper
        run: |
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew missing"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Align Java and Kotlin JVM Targets
        run: |
          cat > "$RUNNER_TEMP/fix-targets.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                  if (task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          ./gradlew \
            --init-script "$RUNNER_TEMP/fix-targets.gradle" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$PROJECT_DIR" \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/output")" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-OPTION-OTC-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14