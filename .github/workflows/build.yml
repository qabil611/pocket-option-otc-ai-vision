name: Build OTC AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check ZIP
        run: |
          ls -la
          test -f POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip
          unzip -t POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -q POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip -d android-project
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Locate Gradle project
        run: |
          FILE=$(find android-project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            echo "Gradle Wrapper missing"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-OPTION-OTC-AI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error