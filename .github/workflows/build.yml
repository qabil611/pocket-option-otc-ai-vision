name: Build OTC AI Android APK

on:
workflow_dispatch:
push:
paths:
- 'POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK packages
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Check source ZIP
    run: |
      test -f POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip
      unzip -t POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip

  - name: Extract Android project
    run: |
      mkdir -p android-project
      unzip -q POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip -d android-project

      GRADLE_FILE=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1)

      if [ -z "$GRADLE_FILE" ]; then
        echo "ERROR: Gradle project tapılmadı!"
        find android-project -maxdepth 4 -type f
        exit 1
      fi

      PROJECT_DIR=$(dirname "$GRADLE_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      echo "Android project: $PROJECT_DIR"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"

      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      else
        gradle assembleDebug --no-daemon
      fi

  - name: Find APK
    run: |
      find "$PROJECT_DIR" -type f -name "*.apk"

      APK=$(find "$PROJECT_DIR" -type f -path "*/outputs/apk/debug/*.apk" | head -1)

      if [ -z "$APK" ]; then
        echo "ERROR: APK yaradılmadı!"
        exit 1
      fi

      echo "APK_PATH=$APK" >> "$GITHUB_ENV"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: POCKET-OPTION-OTC-AI-APK
      path: ${{ env.APK_PATH }}
      if-no-files-found: error