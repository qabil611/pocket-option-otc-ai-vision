name: Build OTC AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check ZIP
        run: |
          test -f POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip
          unzip -t POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q POCKET-OPTION-OTC-AI-V2-ANDROID-SOURCE.zip -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-OPTION-OTC-AI-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error